name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, 'claude/project-thread-nmmdik']
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: haosu-studio
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir dist
          cp -r *.html *.svg *.png *.jpg *.txt *.xml *.webmanifest _headers assets dist/
      - name: Resolve account
        run: |
          # wrangler picks the token's only account when no ID is given
          if [ -n "$ACCOUNT_ID_SECRET" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"; fi
      - name: Create project if missing
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Report site addresses
        run: |
          npx --yes wrangler@3 pages project list > projects.txt
          grep -oE '[a-z0-9-]+\.pages\.dev' projects.txt | sort -u | while read d; do echo "::notice title=pages::$d"; done
          echo "::notice title=files::$(find dist -type f | wc -l)"

  deploy-bahanhan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: bahanhan-redesign
    steps:
      - uses: actions/checkout@v4
      - name: Resolve account
        run: |
          if [ -n "$ACCOUNT_ID_SECRET" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"; fi
      - name: Create project if missing
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy bahanhan-redesign --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Report file count
        run: echo "::notice title=files::$(find bahanhan-redesign -type f | wc -l)"

  # Oia Cafe redesign proposal; also deploys from its working branch so it can be previewed before merging
  deploy-oiacafe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: oiacafe-redesign
    steps:
      - uses: actions/checkout@v4
      - name: Resolve account
        run: |
          if [ -n "$ACCOUNT_ID_SECRET" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"; fi
      - name: Create project if missing
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || true
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy oiacafe-redesign --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Report file count
        run: echo "::notice title=files::$(find oiacafe-redesign -type f | wc -l)"
